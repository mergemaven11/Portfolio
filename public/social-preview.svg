      <stop offset="1" stop-color="#5b5cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>

  <rect width="1200" height="630" rx="36" fill="url(#bg)"/>
  <circle cx="985" cy="300" r="320" fill="url(#glow)"/>
  <path d="M0 505H1200V630H0z" fill="#080b14" fill-opacity=".9"/>

