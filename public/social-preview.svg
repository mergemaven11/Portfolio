    <text x="0" y="226" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="600">Docker  •  Linux  •  Cloud  •  Backend</text>
    <text x="0" y="276" fill="#c5cad8" font-family="Inter,Arial,sans-serif" font-size="22">I build and troubleshoot reliable systems, automate</text>
    <text x="0" y="310" fill="#c5cad8" font-family="Inter,Arial,sans-serif" font-size="22">infrastructure, and ship software that makes an impact.</text>
